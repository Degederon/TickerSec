<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>TickerSec update</title>
  <link rel="stylesheet" href="update-panel.css">
</head>
<body>
  <div id="panel" class="panel">
    <div class="glow"></div>
    <img class="logo" src="../icon.svg" alt="">
    <div class="text">
      <div class="kicker"><span class="dot"></span>UPDATE AVAILABLE</div>
      <div id="title" class="title"></div>
      <div id="notes" class="notes"></div>
    </div>
    <div class="actions">
      <button id="install" class="btn primary">Upgrade now</button>
      <button id="later" class="btn ghost">Later</button>
    </div>
    <div class="timer"><div id="bar" class="bar"></div></div>
  </div>
  <script src="update-panel.js"></script>
</body>
</html>
