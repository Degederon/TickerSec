<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14204d"/>
      <stop offset="1" stop-color="#060a18"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1a3d" stop-opacity=".95"/>
      <stop offset="1" stop-color="#070d22" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M256 70 L410 124 V246 C410 344 344 412 256 446 C168 412 102 344 102 246 V124 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- shield -->
  <path d="M256 70 L410 124 V246 C410 344 344 412 256 446 C168 412 102 344 102 246 V124 Z"
        fill="url(#shieldFill)" stroke="url(#shieldStroke)" stroke-width="16" stroke-linejoin="round"/>

  <!-- ticker bars inside the shield -->
  <g clip-path="url(#shieldClip)">
    <rect x="96" y="176" width="320" height="50" fill="#ffffff" fill-opacity=".07"/>
    <rect x="96" y="176" width="78" height="50" fill="#e8473b"/>
    <rect x="190" y="194" width="150" height="13" rx="6.5" fill="#fff" fill-opacity=".92"/>
    <rect x="352" y="194" width="50" height="13" rx="6.5" fill="#fff" fill-opacity=".45"/>

    <rect x="96" y="240" width="320" height="50" fill="#ffffff" fill-opacity=".07"/>
    <rect x="96" y="240" width="78" height="50" fill="#22c55e"/>
    <rect x="190" y="258" width="110" height="13" rx="6.5" fill="#fff" fill-opacity=".92"/>
    <rect x="312" y="258" width="90" height="13" rx="6.5" fill="#fff" fill-opacity=".45"/>

    <rect x="96" y="304" width="320" height="50" fill="#ffffff" fill-opacity=".07"/>
    <rect x="96" y="304" width="78" height="50" fill="#3b82f6"/>
    <rect x="190" y="322" width="170" height="13" rx="6.5" fill="#fff" fill-opacity=".92"/>
  </g>

  <!-- LIVE badge -->
  <rect x="318" y="58" width="132" height="54" rx="16" fill="#e8192c"/>
  <circle cx="346" cy="85" r="9" fill="#fff"/>
  <text x="364" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#fff">LIVE</text>

  <rect width="512" height="256" rx="112" fill="url(#shine)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="4"/>
</svg>
